name: KIM6 fast checks

on:
  push:
    branches: [kim-all]
  pull_request:
    branches: [kim-all]

permissions:
  contents: read

concurrency:
  group: kim6-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Bash syntax and ShellCheck
        run: |
          bash -n src/bin/kim_all install.sh uninstall.sh
          shellcheck src/bin/kim_all

      - name: Python syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          paths = sorted(Path("tests").glob("*.py"))
          paths += sorted(Path("qa").glob("*.py"))
          paths += sorted(Path("tools").glob("*.py"))

          for path in paths:
              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=str(path),
              )

          print(f"Parsed {len(paths)} Python source files")
          PY

      - name: Dolphin UI and acceptance contracts
        run: |
          python3 -B tests/run.py --pattern 'test_dolphin_ui_audit.py'
          python3 -B tests/run.py --pattern 'test_acceptance_toolkit.py'
