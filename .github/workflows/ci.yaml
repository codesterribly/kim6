name: KIMng fast checks

on:
  push:
    branches: [recovery/kim-all]
  pull_request:
    branches: [recovery/kim-all]

permissions:
  contents: read

concurrency:
  group: kim6-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ShellCheck, ExifTool and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck libimage-exiftool-perl ffmpeg imagemagick-6.q16
          command -v shellcheck
          command -v exiftool
          exiftool -ver
          command -v ffmpeg
          ffmpeg -version
          test -x /usr/bin/identify-im6.q16
          if [ ! -e /usr/bin/identify ]; then
            test ! -L /usr/bin/identify
            sudo ln -s /usr/bin/identify-im6.q16 /usr/bin/identify
          fi
          python3 - <<'VERIFY_IDENTIFY'
          import os
          import shutil
          import subprocess
          executable = shutil.which("identify", path=os.defpath)
          assert executable is not None, "System identify unavailable"
          subprocess.run([executable, "-version"], check=True)
          print("System image validator:", executable)
          VERIFY_IDENTIFY

      - name: Bash syntax and ShellCheck
        run: |
          bash -n src/bin/kim_all install.sh uninstall.sh
          shellcheck --exclude=SC2015 src/bin/kim_all

      - name: Python syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          paths = sorted(Path("tests").glob("*.py"))
          paths += sorted(Path("qa").glob("*.py"))
          paths += sorted(Path("tools").glob("*.py"))
          paths += sorted(Path("src/bin").glob("*.py"))

          for path in paths:
              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=str(path),
              )

          print(f"Parsed {len(paths)} Python source files")
          PY

      - name: Dolphin UI and acceptance contracts
        run: |
          python3 -B tests/run.py --pattern 'test_dolphin_ui_audit.py'
          python3 -B tests/run.py --pattern 'test_acceptance_toolkit.py'

      - name: Install ImageMagick 7 for publication safety tests
        run: |
          set -euo pipefail

          version=7.1.2-36
          archive="ImageMagick-${version}-portable-Q16-linux-x64.tar.xz"
          url="https://download.imagemagick.org/archive/binaries/${archive}"

          mkdir -p "$RUNNER_TEMP/imagemagick7" "$RUNNER_TEMP/kimng-ci-bin"

          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$archive" "$url"

          tar -xJf "$RUNNER_TEMP/$archive" \
            -C "$RUNNER_TEMP/imagemagick7"

          magick_binary="$(find "$RUNNER_TEMP/imagemagick7" \
            -type f -name magick -perm /111 -print -quit)"

          test -n "$magick_binary"

          ln -s "$magick_binary" "$RUNNER_TEMP/kimng-ci-bin/magick"

          cat > "$RUNNER_TEMP/kimng-ci-bin/identify" <<'IDENTIFY'
          #!/bin/bash
          exec "$(dirname "$0")/magick" identify "$@"
          IDENTIFY
          chmod +x "$RUNNER_TEMP/kimng-ci-bin/identify"

          echo "$RUNNER_TEMP/kimng-ci-bin" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/kimng-ci-bin/magick" -version
          "$RUNNER_TEMP/kimng-ci-bin/identify" -version

          "$RUNNER_TEMP/kimng-ci-bin/magick" \
            -size 4x4 xc:red "$RUNNER_TEMP/kimng-ci-image.png"

          "$RUNNER_TEMP/kimng-ci-bin/identify" \
            -format '%m %w %h' "$RUNNER_TEMP/kimng-ci-image.png"

      - name: Critical overwrite and APNG regressions
        run: |
          for test in test_policy_authorization.py test_policy_final_boundary.py test_inplace_authorization.py test_apng_chunk_detection.py test_apng_fail_closed.py; do
            python3 -B tests/run.py --pattern "$test"
          done
