name: KIM6 fast checks

on:
  push:
    branches: [recovery/kim-all]
  pull_request:
    branches: [recovery/kim-all]

permissions:
  contents: read

concurrency:
  group: kim6-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ShellCheck and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck ffmpeg

      - name: Install ImageMagick 7 for publication safety checks
        run: |
          set -euo pipefail
          # Pin the upstream release and verify its published SHA-256.
          version='7.1.2-35'
          image="ImageMagick-${version}-gcc-x86_64.AppImage"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$image" \
            "https://github.com/ImageMagick/ImageMagick/releases/download/${version}/${image}"
          printf '%s  %s\n' \
            'f111044ed06b68cfb478df724c5a32d35145afa21073242f888d234a2f8cc002' \
            "$RUNNER_TEMP/$image" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/$image"
          # Extract once, avoiding a FUSE dependency and repeated extraction.
          mkdir -p "$RUNNER_TEMP/im7"
          cd "$RUNNER_TEMP/im7"
          "$RUNNER_TEMP/$image" --appimage-extract >/dev/null
          mkdir -p "$RUNNER_TEMP/kim6-tools"
          cat > "$RUNNER_TEMP/kim6-tools/magick" <<EOF
          #!/usr/bin/env bash
          exec "$RUNNER_TEMP/im7/squashfs-root/AppRun" "\$@"
          EOF
          cat > "$RUNNER_TEMP/kim6-tools/identify" <<'EOF'
          #!/usr/bin/env bash
          exec "$(dirname "$0")/magick" identify "$@"
          EOF
          chmod +x "$RUNNER_TEMP/kim6-tools/magick" "$RUNNER_TEMP/kim6-tools/identify"
          "$RUNNER_TEMP/kim6-tools/magick" -version
          echo "$RUNNER_TEMP/kim6-tools" >> "$GITHUB_PATH"

      - name: Bash syntax and ShellCheck
        run: |
          bash -n src/bin/kim_all install.sh uninstall.sh
          shellcheck --exclude=SC2015 src/bin/kim_all

      - name: Python syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          paths = sorted(Path("tests").glob("*.py"))
          paths += sorted(Path("qa").glob("*.py"))
          paths += sorted(Path("tools").glob("*.py"))
          paths += sorted(Path("src/bin").glob("*.py"))

          for path in paths:
              ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=str(path),
              )

          print(f"Parsed {len(paths)} Python source files")
          PY

      - name: Dolphin UI and acceptance contracts
        run: |
          python3 -B tests/run.py --pattern 'test_dolphin_ui_audit.py'
          python3 -B tests/run.py --pattern 'test_acceptance_toolkit.py'

      - name: Critical overwrite and APNG regressions
        run: |
          for test in test_policy_authorization.py test_policy_final_boundary.py test_inplace_authorization.py test_apng_chunk_detection.py test_apng_fail_closed.py; do
            python3 -B tests/run.py --pattern "$test"
          done
